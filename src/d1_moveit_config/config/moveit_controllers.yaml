moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  # MuJoCo/ros2_control can finish a few control cycles after the nominal
  # time-parameterized duration. Keep path tolerances active while allowing
  # enough wall-clock margin for that scheduling jitter.
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 2.0
  # Keep consecutive trajectories consistent with the arm controller's
  # 0.04-rad terminal tolerance. A state accepted as the previous goal must
  # also be accepted as the next prevalidated trajectory's start state.
  allowed_start_tolerance: 0.04

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [Joint0, Joint1, Joint2, Joint3, Joint4, Joint5]

  gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints: [Joint6]
