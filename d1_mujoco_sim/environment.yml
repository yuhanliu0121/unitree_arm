name: trash_collection
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      # Required when ROS 2 Humble generates interfaces with Conda's Python.
      - catkin-pkg>=0.5,<2
      - cyclonedds==11.0.1
      # ROS 2 Humble rosidl_adapter imports the legacy ``em`` API.
      - empy==3.3.4
      - lark>=1.1,<2
      - mujoco==3.11.0
      - numpy>=2.0,<3
      - opencv-python>=4.10
      - PyYAML>=6,<7
      # ROS 2 Humble's launch_testing plugin is incompatible with pytest 8+.
      - pytest>=7,<8
      # Versions validated by the perception runtime on the development PC.
      - torch==2.13.0+cpu
      - torchvision==0.28.0+cpu
      - trimesh==5.0.0
      - pycollada==0.9.3
      - ultralytics==8.4.117
      - -e .
