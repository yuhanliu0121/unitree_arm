d1_pick_object:
  ros__parameters:
    gravity_frame: gravity_frame
    # Physical D1 calibration. The hardware bridge maps SDK J6=-30..+60 deg
    # linearly onto ROS Joint6=0.00..0.03 m.
    cube_gripper_closed_m: 0.0216666667       # +35 deg
    cube_gripper_held_threshold_m: 0.0225     # +37.5 deg
    zucchini_gripper_closed_m: 0.0066666667   # -10 deg
    zucchini_gripper_held_threshold_m: 0.01   #   0 deg
    bowl_gripper_closed_m: 0.0                # -30 deg
    bowl_gripper_held_threshold_m: 0.0006666667  # -28 deg

# Real-machine task geometry uses the gravity frame frozen by the motionless
# preflight. These node-specific values intentionally override the simulation
# `world` defaults in observe_target.yaml/perception_adapter.yaml.
d1_observe_target:
  ros__parameters:
    gravity_frame: gravity_frame

d1_drop_object:
  ros__parameters:
    gravity_frame: gravity_frame

d1_detect_target:
  ros__parameters:
    gravity_frame: gravity_frame
