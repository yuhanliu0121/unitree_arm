d1_observe_target:
  ros__parameters:
    action_name: /arm/debug/observe_target
    planning_frame: base_link
    gravity_frame: world
    arm_group: arm
    link6_frame: Link6
    color_optical_frame: wrist_camera_color_optical_frame
    color_camera_info_topic: /wrist_camera/color/camera_info

    # Ordered samples. The server uses beta as the outer loop, alpha as the
    # middle loop, and distance as the inner loop without re-sorting.
    beta_degrees: [0.0, -5.0, 5.0, -10.0, 10.0, -15.0, 15.0]
    alpha_degrees: [45.0, 40.0, 50.0, 35.0, 55.0, 30.0, 60.0, 65.0, 70.0]
    distances_m: [0.35, 0.30, 0.40, 0.45, 0.50, 0.55, 0.60]

    tf_timeout_s: 10.0
    planning_time_s: 1.5
    planning_attempts: 2
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    position_tolerance_m: 0.005
    orientation_tolerance_rad: 0.03
    camera_settle_s: 0.5
    max_target_pixel_error: 30.0
    real_joint_goal_tolerance_rad: 0.034906585
    real_joint_goal_stable_samples: 3
    real_joint_goal_assumed_speed_deg_s: 10.0
    real_joint_goal_timeout_padding_s: 3.0
    real_joint_goal_minimum_timeout_s: 5.0
    real_joint_goal_feedback_timeout_s: 1.5

    # Temporary nominal ground used by MoveIt until the perception-fitted
    # plane is promoted into the planning scene.
    ground_surface_z_m: -0.225248769402

d1_pick_object:
  ros__parameters:
    action_name: /arm/tasks/pick_object
    observe_action_name: /arm/debug/observe_target
    target_detection_service_name: /arm/perception/detect_target
    cube_estimation_service_name: /arm/perception/estimate_cube
    zucchini_estimation_service_name: /arm/perception/estimate_zucchini
    bowl_estimation_service_name: /arm/perception/estimate_bowl
    held_object_verification_service_name: /arm/perception/verify_held_object
    planning_frame: base_link
    gravity_frame: world
    arm_group: arm
    link6_frame: Link6
    tcp_frame: tcp_link
    color_optical_frame: wrist_camera_color_optical_frame
    cube_size_m: 0.05
    pregrasp_distance_max_m: 0.040
    pregrasp_distance_min_m: 0.015
    pregrasp_distance_step_m: 0.005
    grasp_distance_min_m: -0.040
    grasp_distance_max_m: -0.024
    grasp_distance_step_m: 0.002
    cube_joint5_motion_weight: 2.0
    # PREGRASP visual fine-tuning is the default cube grasp path. The safe
    # prism is calibrated for the shared D1 + wrist-camera hardware layout.
    cube_finetune_enabled: true
    cube_finetune_camera_frame: wrist_camera_color_optical_frame
    cube_finetune_closing_axis_camera: [-0.9964914766084, 0.030719609390554355, -0.07785269838420857]
    cube_finetune_finger_axis_camera: [0.008596773865607941, 0.9628521848541389, 0.26989213697459724]
    cube_finetune_closing_bounds_m: [-0.04352345527058814, -0.03940754708007975]
    cube_finetune_finger_bounds_m: [0.07775923811314761, 0.11838677790731594]
    cube_finetune_gain: 0.7
    cube_finetune_max_step_m: 0.008
    cube_finetune_max_total_m: 0.020
    cube_finetune_max_corrections: 3
    cube_finetune_samples: 3
    cube_finetune_max_stddev_m: 0.0015
    cube_finetune_settle_s: 0.5
    # All PREGRASP visual corrections use a slow uniform joint speed. Success
    # is determined only by entering the calibrated region within three moves.
    finetune_motion_speed_deg_s: 5.0
    lift_distance_m: 0.10
    carry_joint_positions: [0.0, -1.54, 1.546, 0.0, -0.6, 1.57]
    top_observation_distance_m: 0.35
    top_observation_distances_m: [0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
    top_observation_roll_degrees: [0.0, 90.0, -90.0, 180.0, 45.0, -45.0, 135.0, -135.0]
    camera_settle_s: 0.5
    cartesian_step_m: 0.005
    minimum_cartesian_fraction: 0.999
    gripper_open_m: 0.03
    grasp_settle_s: 0.5
    gripper_verify_settle_s: 0.5
    gripper_verify_sample_s: 1.0
    gripper_verify_min_samples: 5
    gripper_verify_min_pass_ratio: 0.8
    gripper_safe_closed_angle_deg: -30.0
    gripper_safe_open_angle_deg: 60.0
    gripper_travel_m: 0.03
    zucchini_length_m: 0.15
    zucchini_width_m: 0.040
    zucchini_height_m: 0.03312
    # Explicit TCP-to-ground PREGRASP search. 90 mm reproduces the camera
    # working distance validated by cube top + 40 mm.
    zucchini_pregrasp_ground_clearance_max_m: 0.090
    zucchini_pregrasp_ground_clearance_min_m: 0.065
    zucchini_pregrasp_ground_clearance_step_m: 0.005
    zucchini_tcp_ground_clearance_m: 0.001
    zucchini_tcp_ground_clearance_max_m: 0.015
    zucchini_tcp_ground_clearance_step_m: 0.002
    zucchini_joint5_motion_weight: 2.0
    # Two physically validated boundaries define a closing-direction safe
    # slab. It is intentionally unbounded along finger length and gravity.
    # FINETUNE_GRASP drives the perceived local-axis midpoint toward the slab
    # centre, rather than merely accepting a point close to either boundary.
    zucchini_finetune_enabled: true
    zucchini_finetune_camera_frame: wrist_camera_color_optical_frame
    zucchini_finetune_closing_axis_camera: [-0.9968582850544625, 0.025625090897871242, -0.07494607551267711]
    zucchini_finetune_gravity_axis_camera: [0.0788559187407329, 0.23224371268360905, -0.9694558277706562]
    zucchini_finetune_closing_bounds_m: [-0.045322211086450064, -0.02828342224597395]
    zucchini_finetune_gain: 0.7
    zucchini_finetune_max_step_m: 0.008
    zucchini_finetune_max_total_m: 0.020
    zucchini_finetune_max_corrections: 3
    zucchini_finetune_samples: 3
    zucchini_finetune_max_stddev_m: 0.0015
    zucchini_finetune_settle_s: 0.5
    bowl_pregrasp_distance_max_m: 0.080
    bowl_pregrasp_distance_min_m: 0.015
    bowl_pregrasp_distance_step_m: 0.005
    bowl_radius_m: 0.058
    bowl_height_m: 0.05001143
    bowl_joint5_motion_weight: 2.0
    planning_time_s: 5.0
    planning_attempts: 6
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    position_tolerance_m: 0.005
    orientation_tolerance_rad: 0.03

d1_drop_object:
  ros__parameters:
    action_name: /arm/tasks/drop_object
    planning_frame: base_link
    gravity_frame: world
    arm_group: arm
    tcp_frame: tcp_link
    height_offsets_m: [0.0, -0.025, -0.050, 0.025, 0.050]
    yaw_offsets_degrees: [0.0, 15.0, -15.0, 30.0, -30.0, 45.0, -45.0, 60.0, -60.0, 75.0, -75.0, 90.0, -90.0]
    gripper_open_m: 0.03
    gripper_open_hold_s: 0.5
    planning_time_s: 5.0
    planning_attempts: 6
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    position_tolerance_m: 0.005
    orientation_tolerance_rad: 0.03
