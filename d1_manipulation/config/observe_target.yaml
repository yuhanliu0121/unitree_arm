d1_observe_target:
  ros__parameters:
    action_name: /arm/debug/observe_target
    planning_frame: base_link
    gravity_frame: world
    arm_group: arm
    link6_frame: Link6
    color_optical_frame: wrist_camera_color_optical_frame
    color_camera_info_topic: /wrist_camera/color/camera_info

    # Ordered samples. The server uses beta as the outer loop, alpha as the
    # middle loop, and distance as the inner loop without re-sorting.
    beta_degrees: [0.0, -5.0, 5.0, -10.0, 10.0, -15.0, 15.0]
    alpha_degrees: [45.0, 40.0, 50.0, 35.0, 55.0, 30.0, 60.0, 65.0, 70.0]
    distances_m: [0.35, 0.30, 0.40, 0.45, 0.50, 0.55, 0.60]

    tf_timeout_s: 10.0
    planning_time_s: 1.5
    planning_attempts: 2
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    position_tolerance_m: 0.005
    orientation_tolerance_rad: 0.03
    camera_settle_s: 0.5
    max_target_pixel_error: 30.0
    real_joint_goal_tolerance_rad: 0.034906585
    real_joint_goal_stable_samples: 3
    real_joint_goal_assumed_speed_deg_s: 10.0
    real_joint_goal_timeout_padding_s: 3.0
    real_joint_goal_minimum_timeout_s: 5.0
    real_joint_goal_feedback_timeout_s: 1.5

    # Temporary nominal ground used by MoveIt until the perception-fitted
    # plane is promoted into the planning scene.
    ground_surface_z_m: -0.225248769402

d1_pick_object:
  ros__parameters:
    action_name: /arm/tasks/pick_object
    observe_action_name: /arm/debug/observe_target
    target_detection_service_name: /arm/perception/detect_target
    cube_estimation_service_name: /arm/perception/estimate_cube
    zucchini_estimation_service_name: /arm/perception/estimate_zucchini
    bowl_estimation_service_name: /arm/perception/estimate_bowl
    held_object_verification_service_name: /arm/perception/verify_held_object
    planning_frame: base_link
    gravity_frame: world
    arm_group: arm
    link6_frame: Link6
    tcp_frame: tcp_link
    color_optical_frame: wrist_camera_color_optical_frame
    cube_size_m: 0.05
    pregrasp_distance_max_m: 0.080
    pregrasp_distance_min_m: 0.015
    pregrasp_distance_step_m: 0.005
    grasp_distance_min_m: -0.040
    grasp_distance_max_m: -0.024
    grasp_distance_step_m: 0.002
    lift_distance_m: 0.10
    carry_joint_positions: [0.0, -1.54, 1.546, 0.0, -0.6, 1.57]
    top_observation_distance_m: 0.35
    top_observation_distances_m: [0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
    top_observation_roll_degrees: [0.0, 90.0, -90.0, 180.0, 45.0, -45.0, 135.0, -135.0]
    camera_settle_s: 0.5
    cartesian_step_m: 0.005
    minimum_cartesian_fraction: 0.999
    gripper_open_m: 0.03
    grasp_settle_s: 0.5
    gripper_verify_settle_s: 0.5
    gripper_verify_sample_s: 1.0
    gripper_verify_min_samples: 5
    gripper_verify_min_pass_ratio: 0.8
    gripper_safe_closed_angle_deg: -30.0
    gripper_safe_open_angle_deg: 60.0
    gripper_travel_m: 0.03
    zucchini_length_m: 0.15
    zucchini_width_m: 0.040
    zucchini_height_m: 0.03312
    zucchini_pregrasp_distance_max_m: 0.080
    zucchini_pregrasp_distance_min_m: 0.015
    zucchini_pregrasp_distance_step_m: 0.005
    zucchini_tcp_ground_clearance_m: 0.015
    bowl_pregrasp_distance_max_m: 0.080
    bowl_pregrasp_distance_min_m: 0.015
    bowl_pregrasp_distance_step_m: 0.005
    bowl_radius_m: 0.058
    bowl_height_m: 0.05001143
    planning_time_s: 5.0
    planning_attempts: 6
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    position_tolerance_m: 0.005
    orientation_tolerance_rad: 0.03

d1_drop_object:
  ros__parameters:
    action_name: /arm/tasks/drop_object
    planning_frame: base_link
    gravity_frame: world
    arm_group: arm
    tcp_frame: tcp_link
    height_offsets_m: [0.0, -0.025, -0.050, 0.025, 0.050]
    yaw_offsets_degrees: [0.0, 15.0, -15.0, 30.0, -30.0, 45.0, -45.0, 60.0, -60.0, 75.0, -75.0, 90.0, -90.0]
    gripper_open_m: 0.03
    gripper_open_hold_s: 0.5
    planning_time_s: 5.0
    planning_attempts: 6
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    position_tolerance_m: 0.005
    orientation_tolerance_rad: 0.03
