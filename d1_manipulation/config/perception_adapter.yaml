d1_detect_target:
  ros__parameters:
    service_name: /arm/perception/detect_target
    cube_estimation_service_name: /arm/perception/estimate_cube
    zucchini_estimation_service_name: /arm/perception/estimate_zucchini
    bowl_estimation_service_name: /arm/perception/estimate_bowl
    held_object_verification_service_name: /arm/perception/verify_held_object
    color_topic: /wrist_camera/color/image_raw
    aligned_depth_topic: /wrist_camera/aligned_depth_to_color/image_raw
    aligned_camera_info_topic: /wrist_camera/aligned_depth_to_color/camera_info
    planning_frame: base_link
    gravity_frame: world
    profile: arm
    fresh_frame_timeout_s: 3.0
    tf_timeout_s: 1.0
    sync_tolerance_s: 0.02
    max_hint_mask_distance_px: 120.0
    depth_scale_m_per_unit: 0.001
    debug_overlay_topic: /arm/perception/debug/overlay
    cube_debug_overlay_topic: /arm/perception/debug/cube_geometry
    zucchini_debug_overlay_topic: /arm/perception/debug/zucchini_geometry
    bowl_debug_overlay_topic: /arm/perception/debug/bowl_geometry
    ground_ransac_distance_m: 0.008
    ground_normal_tolerance_deg: 15.0
    ground_ransac_iterations: 160
    ground_max_points: 12000
    cube_half_size_m: 0.025
    zucchini_coarse_plane_height_m: 0.010
    zucchini_center_height_m: 0.01656
    zucchini_debug_directory: /tmp/d1_zucchini_debug_latest
    held_verify_frames: 3
    held_verify_roi_radius_px: 140
    held_verify_min_area_px: 500
    yellow_hsv_lower: [18, 70, 60]
    yellow_hsv_upper: [40, 255, 255]
    green_hsv_lower: [35, 45, 25]
    green_hsv_upper: [95, 255, 255]
    held_verify_green_min_area_px: 500
